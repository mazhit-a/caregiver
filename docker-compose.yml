services:
  db:
    image: postgres:16.6
    environment:
      POSTGRES_USER: pcn
      POSTGRES_PASSWORD: pcn
      POSTGRES_DB: pcn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcn -d pcn"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      CONTENT_DIR: /srv/content
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./content:/srv/content:ro
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  caddy:
    image: caddy:2.8
    environment:
      # Empty or unset = plain HTTP on :80 (local). A domain name = automatic HTTPS (Let's Encrypt).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
